name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo. Fork PRs already run without
# secrets — this keeps the token read-only too.
permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    # Normal runs finish in well under a minute; the cap stops a wedged job
    # from burning the 6-hour GitHub default. The harness runs in its own
    # matrix job below, with its own watchdog.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # gradle-wrapper.jar is a committed binary; verify it matches a known
      # Gradle release rather than trusting whatever is in the tree.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      # No signing properties are passed, so skipModlSigning leaves the module
      # unsigned here (build.gradle.kts). That is what we want for CI: this job
      # proves the module assembles, not that the release keys work — the
      # release workflow's dry run covers signing.
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace
        env:
          ORG_GRADLE_PROJECT_org.gradle.java.installations.auto-download: "false"

      # Cheap guard on what is most likely to regress silently in module.xml:
      # the EULA reference and what makes the gateway list the module as Free.
      # That is the gateway-scope hook and its jar, not <freeModule>: the 8.3
      # gateway ignores the element and asks the G hook's isFreeModule()
      # instead (#114), so a build that lost the hook would show "Trial"
      # again. The element is still checked, since build.gradle.kts sets it.
      # None of this has a test that would catch an accidental removal.
      - name: Check module.xml wiring
        run: |
          modl="$(find build -maxdepth 1 -name '*.unsigned.modl' | head -1)"
          if [ -z "$modl" ]; then echo "::error::no .modl produced"; exit 1; fi
          xml="$(unzip -p "$modl" module.xml)"
          echo "$xml"
          echo "$xml" | grep -q '<license>license.html</license>' \
            || { echo "::error::module.xml is missing the <license> element"; exit 1; }
          echo "$xml" | grep -q '<freeModule>true</freeModule>' \
            || { echo "::error::module.xml no longer declares freeModule=true"; exit 1; }
          echo "$xml" | grep -q '<hook scope="G">com.mustrysolutions.designerdarkmode.gateway.DesignerDarkModeGatewayHook</hook>' \
            || { echo "::error::module.xml has no gateway hook; the gateway will list the module as Trial (#114)"; exit 1; }
          echo "$xml" | grep -Eq '<jar scope="G">gateway-[^<]*\.jar</jar>' \
            || { echo "::error::module.xml ships no gateway jar for the G hook"; exit 1; }
          unzip -l "$modl" | grep -q 'license.html' \
            || { echo "::error::license.html was not staged into the .modl"; exit 1; }

  harness:
    name: LaF harness (${{ matrix.os }})
    # Not part of `build`: the harness resolves the whole Designer dependency
    # tree at runtime and needs its own JDK module openings, so `check` should
    # not drag it in by accident. It still has to run somewhere, or it rots —
    # and it is the only check here that exercises the switch sequence against
    # the real Synthetica/JIDE/FlatLaf interaction rather than against stubs.
    #
    # Windowed on every row (#42): the passes that walk Window.getWindows()
    # are only reachable with a display, so Linux gets one from Xvfb and the
    # macOS and Windows runners use their own. The window-level tests fail
    # rather than skip when the property is given and the JVM is still
    # headless, so a runner that loses its display shows up as red, not as a
    # quietly smaller suite.
    #
    # On all three operating systems, because the module has only ever been
    # watched on macOS and the things that differ per platform — which JDK
    # packages the JVM opens, which font FlatLaf resolves, how Java2D
    # rasterises — are things the harness sees and a Linux-only run does not.
    # fail-fast is off so one platform's failure still shows the other two.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Resolving the Designer's dependency tree is the slow part, and the
    # Windows runner is the slow platform.
    timeout-minutes: 25
    defaults:
      run:
        # Git Bash on Windows, so `./gradlew` and the flags read the same on
        # every row of the matrix.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb

      # Twice, on purpose (#53). The module reaches Ignition and JIDE internals
      # by NAME — classes, fields, methods that no compiler checks — so it has
      # to be exercised against both ends of what it claims to support:
      # 8.3.0 is the floor in requiredIgnitionVersion, and the default is the
      # current release, which is what people actually run. A rename in a
      # recent 8.3.x is invisible if you only ever test the floor.
      #
      # Through a watchdog, not plain gradlew (#94): a hang used to sit until
      # the job cap cancelled it, leaving nothing to read. The wrapper
      # thread-dumps every Gradle JVM after the deadline and fails the step.
      # The deadline is raised from its 300 s default because the Windows and
      # macOS runners resolve the whole Designer dependency tree cold, which
      # alone takes a few minutes; a healthy warm run is ~35 s. Where pgrep is
      # missing (Git Bash on Windows) the watchdog still fails the step, just
      # without a jstack — JUnit's own per-test timeout dump, which runs
      # inside the test JVM, covers that case on every platform.
      - name: Windowed look-and-feel harness (current Ignition)
        # eval, so the wrapper's quoted screen argument survives as one word.
        run: eval "$DISPLAY_WRAPPER ops/laf-harness-watchdog.sh -Pharness.windowed=true"
        env:
          # xvfb-run -a picks a free display number; the screen only has to
          # exist, nothing is ever shown on it. 24-bit, or Java2D is handed
          # an 8-bit visual and renders through a palette.
          DISPLAY_WRAPPER: ${{ runner.os == 'Linux' && 'xvfb-run -a -s "-screen 0 1280x1024x24"' || '' }}
          HARNESS_DEADLINE_SECONDS: "900"
          ORG_GRADLE_PROJECT_org.gradle.java.installations.auto-download: "false"

      - name: Windowed look-and-feel harness (support floor)
        run: eval "$DISPLAY_WRAPPER ops/laf-harness-watchdog.sh -Pharness.windowed=true -Pharness.sdk=8.3.0"
        env:
          DISPLAY_WRAPPER: ${{ runner.os == 'Linux' && 'xvfb-run -a -s "-screen 0 1280x1024x24"' || '' }}
          HARNESS_DEADLINE_SECONDS: "900"
          ORG_GRADLE_PROJECT_org.gradle.java.installations.auto-download: "false"

      # Thread dumps from the watchdog, JUnit's per-test results (full stack
      # traces, and its own timeout dump in <system-out>), the module's
      # debug log — whose environment block is what a failing platform is
      # read against — and, when the pixel test fails, its three renders.
      - name: Upload harness diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: laf-harness-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            build/laf-harness-threads-*.txt
            designer/build/test-results/lafHarness/
            designer/build/laf-harness-debug.log
            designer/build/laf-harness-renders/
