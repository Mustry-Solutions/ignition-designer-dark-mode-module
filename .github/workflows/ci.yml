name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo. Fork PRs already run without
# secrets — this keeps the token read-only too.
permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    # Normal runs finish in well under a minute; the cap stops a wedged job
    # from burning the 6-hour GitHub default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # gradle-wrapper.jar is a committed binary; verify it matches a known
      # Gradle release rather than trusting whatever is in the tree.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      # No signing properties are passed, so skipModlSigning leaves the module
      # unsigned here (build.gradle.kts). That is what we want for CI: this job
      # proves the module assembles, not that the release keys work — the
      # release workflow's dry run covers signing.
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace
        env:
          ORG_GRADLE_PROJECT_org.gradle.java.installations.auto-download: "false"

      # Not part of `build`: the harness resolves the whole Designer dependency
      # tree at runtime and needs its own JDK module openings, so `check` should
      # not drag it in by accident. It still has to run somewhere, or it rots —
      # and it is the only check here that exercises the switch sequence against
      # the real Synthetica/JIDE/FlatLaf interaction rather than against stubs.
      # Headless by construction; no display is set up for it on purpose.
      # Twice, on purpose (#53). The module reaches Ignition and JIDE internals
      # by NAME — classes, fields, methods that no compiler checks — so it has
      # to be exercised against both ends of what it claims to support:
      # 8.3.0 is the floor in requiredIgnitionVersion, and the default is the
      # current release, which is what people actually run. A rename in a
      # recent 8.3.x is invisible if you only ever test the floor.
      - name: Headless look-and-feel harness (current Ignition)
        run: ./gradlew :designer:lafHarness --no-daemon --stacktrace
        env:
          ORG_GRADLE_PROJECT_org.gradle.java.installations.auto-download: "false"

      - name: Headless look-and-feel harness (support floor)
        run: ./gradlew :designer:lafHarness -Pharness.sdk=8.3.0 --no-daemon --stacktrace
        env:
          ORG_GRADLE_PROJECT_org.gradle.java.installations.auto-download: "false"

      # Cheap guard on the two things most likely to regress silently in
      # module.xml: the EULA reference and the free-module flag. Both are set
      # in build.gradle.kts and neither has a test that would catch a
      # accidental removal.
      - name: Check module.xml wiring
        run: |
          modl="$(find build -maxdepth 1 -name '*.unsigned.modl' | head -1)"
          if [ -z "$modl" ]; then echo "::error::no .modl produced"; exit 1; fi
          xml="$(unzip -p "$modl" module.xml)"
          echo "$xml"
          echo "$xml" | grep -q '<license>license.html</license>' \
            || { echo "::error::module.xml is missing the <license> element"; exit 1; }
          echo "$xml" | grep -q '<freeModule>true</freeModule>' \
            || { echo "::error::module.xml no longer declares freeModule=true"; exit 1; }
          unzip -l "$modl" | grep -q 'license.html' \
            || { echo "::error::license.html was not staged into the .modl"; exit 1; }
