name: Release

# A release is a git tag `vX.Y.Z`. Pushing the tag builds + signs the module
# for both Ignition lines, then publishes a GitHub Release with both signed
# .modl files attached: designer-dark-mode.modl (8.3) and
# designer-dark-mode-8.1.modl (8.1.33 and later). The tag drives the version.
#
# Required secrets (repo or org level — Settings → Secrets and variables → Actions):
#   SIGNING_KEYSTORE_B64       base64 of the signing keystore (.p12/.jks)
#   SIGNING_CERT_B64           base64 of the certificate chain (.pem)
#   SIGNING_KEYSTORE_PASSWORD  keystore password
#   SIGNING_CERT_ALIAS         key alias inside the keystore
#   SIGNING_CERT_PASSWORD      key password (often == keystore password)
#
# Validate the signing path without publishing: run this workflow manually
# with dry_run=true. It builds, signs and uploads both .modl files as an
# artifact.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (dry-run only; no tag involved)'
        default: '0.0.0-test'
        type: string
      dry_run:
        description: 'Build + sign only, no GitHub Release'
        default: true
        type: boolean

permissions:
  contents: write   # create the release + upload the asset

jobs:
  release:
    name: Build, sign & publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Derive version + publish flag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            # Policy: plain x.y.z tags only. Ignition's module.xml version
            # parser is numeric-only — a prerelease suffix (v0.1.0-beta.1)
            # produces a .modl the gateway rejects at install. Bump the patch
            # number instead.
            if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Tag version '$version' is not plain x.y.z — prerelease suffixes break Ignition's numeric module version parser. Bump the patch number instead."
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "publish=${{ !inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode signing material
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          CERT_B64: ${{ secrets.SIGNING_CERT_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$CERT_B64" ]; then
            echo "::error::Signing secrets missing. Add SIGNING_KEYSTORE_B64, SIGNING_CERT_B64, SIGNING_KEYSTORE_PASSWORD, SIGNING_CERT_ALIAS, SIGNING_CERT_PASSWORD."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.p12"
          printf '%s' "$CERT_B64" | base64 -d > "$RUNNER_TEMP/cert.pem"

      # One source tree, two files (see ignition.line in build.gradle.kts): no
      # single requiredIgnitionVersion is accepted by both an 8.1 and an 8.3
      # gateway. No `clean` between the builds: the names differ.
      - name: Build & sign the module (8.3 and 8.1)
        env:
          ORG_GRADLE_PROJECT_org.gradle.java.installations.auto-download: "false"
        run: |
          for line in 8.3 8.1; do
            ./gradlew build --no-daemon --stacktrace \
              -Pignition.line="$line" \
              -PreleaseVersion="${{ steps.ver.outputs.version }}" \
              -Pignition.signing.keystoreFile="$RUNNER_TEMP/keystore.p12" \
              -Pignition.signing.keystorePassword="${{ secrets.SIGNING_KEYSTORE_PASSWORD }}" \
              -Pignition.signing.certFile="$RUNNER_TEMP/cert.pem" \
              -Pignition.signing.certAlias="${{ secrets.SIGNING_CERT_ALIAS }}" \
              -Pignition.signing.certPassword="${{ secrets.SIGNING_CERT_PASSWORD }}"
          done

      - name: Locate the signed .modl files
        id: modl
        run: |
          for f in build/designer-dark-mode.modl build/designer-dark-mode-8.1.modl; do
            [ -f "$f" ] || { echo "::error::$f was not produced"; exit 1; }
          done
          echo "v83=build/designer-dark-mode.modl" >> "$GITHUB_OUTPUT"
          echo "v81=build/designer-dark-mode-8.1.modl" >> "$GITHUB_OUTPUT"

      # A signed Ignition .modl carries certificates.p7b + signatures.properties
      # (an unsigned one has neither) — not a JAR-style META-INF block. Each
      # file must also carry the tag's version and its own line's floor.
      - name: Verify signatures, versions and floors
        run: |
          verify() {
            f="$1"; floor="$2"
            echo "Signed artifact: $f"
            names="$(unzip -l "$f")"
            echo "$names" | grep -q 'certificates.p7b' && echo "$names" | grep -q 'signatures.properties' \
              || { echo "::error::$f is not signed (missing certificates.p7b / signatures.properties)"; exit 1; }
            xml="$(unzip -p "$f" module.xml)"
            echo "$xml" | grep -q "<version>${{ steps.ver.outputs.version }}</version>" \
              || { echo "::error::$f: module.xml version does not match the tag"; echo "$xml"; exit 1; }
            echo "$xml" | grep -q "<requiredIgnitionVersion>$floor</requiredIgnitionVersion>" \
              || { echo "::error::$f does not require Ignition $floor"; echo "$xml"; exit 1; }
          }
          verify "${{ steps.modl.outputs.v83 }}" 8.3.0
          verify "${{ steps.modl.outputs.v81 }}" 8.1.33

      # The release notes ARE the CHANGELOG section for this version. Generated
      # notes are a list of commit subjects, which says what was touched but not
      # what was wrong or why it broke — the part a reader of a release actually
      # needs. Fail loudly rather than publish a release with no notes.
      - name: Extract the release notes from the CHANGELOG
        id: notes
        if: ${{ steps.ver.outputs.publish == 'true' }}
        run: |
          awk -v ver="${{ steps.ver.outputs.version }}" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no '## [${{ steps.ver.outputs.version }}]' section. Add one before tagging."
            exit 1
          fi
          # Every release page carries the same footer: the Download link in
          # the README lands here, so this is where a reader learns who made it.
          cat >> "$RUNNER_TEMP/notes.md" <<'FOOTER'

          ---

          Designer Dark Mode is free and made by [Mustry Solutions](https://mustrysolutions.com), an IT/OT consultancy that builds Ignition systems and modules. We also sell [Ignition 8.3 modules](https://mustrysolutions.com/ignition-modules) (TimescaleDB, AMQP, Observability, Secrets) and build modules to order. [Get in touch](https://mustrysolutions.com/contact-us).
          FOOTER
          echo "path=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"

      # Dry run (workflow_dispatch): keep the signed .modl as an artifact
      # instead of publishing — the way to confirm the signing secrets work.
      - name: Upload signed .modl files (dry run)
        if: ${{ steps.ver.outputs.publish != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: signed-modl-${{ steps.ver.outputs.version }}
          path: |
            ${{ steps.modl.outputs.v83 }}
            ${{ steps.modl.outputs.v81 }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ steps.ver.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Draft first, publish only once the asset is attached — a failed
          # upload must never leave a half-public release.
          gh release create "$GITHUB_REF_NAME" \
            --title "v${{ steps.ver.outputs.version }}" \
            --notes-file "${{ steps.notes.outputs.path }}" \
            --draft \
            "${{ steps.modl.outputs.v83 }}" \
            "${{ steps.modl.outputs.v81 }}"
          gh release edit "$GITHUB_REF_NAME" --draft=false
